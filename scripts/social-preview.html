<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joseph Tabalon social preview</title>
    <link rel="icon" href="data:," />
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        src: url('../node_modules/@expo-google-fonts/inter/400Regular/Inter_400Regular.ttf');
      }

      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 600;
        src: url('../node_modules/@expo-google-fonts/inter/600SemiBold/Inter_600SemiBold.ttf');
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #f5f0e7;
        color: #191512;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 330px;
        align-items: center;
        gap: 76px;
        width: 100%;
        height: 100%;
        padding: 72px 88px;
      }

      .copy {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .role {
        margin: 0 0 20px;
        color: #725a3d;
        font-size: 24px;
        font-weight: 600;
        line-height: 1.25;
      }

      h1 {
        margin: 0;
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -0.055em;
        line-height: 0.98;
      }

      .headline {
        max-width: 640px;
        margin: 38px 0 0;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.2;
      }

      .portrait-frame {
        width: 330px;
        height: 390px;
        overflow: hidden;
        border: 1px solid #d8cbb6;
        border-radius: 32px;
        background: #fbf7f0;
        box-shadow: 0 24px 56px rgba(68, 50, 31, 0.12);
      }

      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="copy">
        <p class="role">Senior Data Scientist</p>
        <h1>Joseph Tabalon</h1>
        <p class="headline">Machine learning that holds up beyond the notebook.</p>
      </section>
      <div class="portrait-frame">
        <img src="../assets/images/icon.png" alt="Joseph Tabalon, Senior Data Scientist" />
      </div>
    </main>
  </body>
</html>
